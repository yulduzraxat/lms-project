{% extends 'base.html' %}
{% block title %}Verify Payment — EDULIX{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card glass" style="text-align:center;">
    <h1 class="section-title">Enter Confirmation Code</h1>
    <p class="text-muted mb-6">A 5-digit code has been sent to your phone.</p>

    {% if error %}<p class="form-error" style="margin-bottom:1rem;">{{ error }}</p>{% endif %}

    <form method="post" class="auth-form">
      {% csrf_token %}
      <input type="text" name="code" class="input-field code-input" maxlength="5" placeholder="•••••" required>
      <button type="submit" class="btn btn-primary w-full">Confirm Payment</button>
    </form>
  </div>
</div>
{% endblock %}
