{% extends 'base.html' %}
{% block title %}New Quiz — EDULIX{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card glass">
    <h1 class="section-title">Create a quiz for "{{ course.title }}"</h1>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Quiz title</label>
        {{ form.title }}
      </div>
      <div class="form-group">
        <label>Time limit (minutes, 0 = unlimited)</label>
        {{ form.time_limit }}
      </div>
      <button type="submit" class="btn btn-primary w-full">Create and add questions</button>
    </form>
  </div>
</div>
{% endblock %}
