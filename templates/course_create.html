{% extends 'base.html' %}
{% block title %}New Course — EDULIX{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card glass">
    <h1 class="section-title">Create a new course</h1>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label>Course title</label>
        {{ form.title }}
        {% if form.title.errors %}<p class="form-error">{{ form.title.errors.0 }}</p>{% endif %}
      </div>

      <div class="form-group">
        <label>Category</label>
        <div class="dropdown">
          <button type="button" class="dropdown-toggle">
            <span class="dropdown-label">Subjects</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-item active" data-value="fan">Subjects</div>
            <div class="dropdown-item" data-value="kasb">Careers</div>
          </div>
          <input type="hidden" name="category" value="fan">
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        {{ form.description }}
      </div>

      <div class="form-group">
        <label>Cover image</label>
        <label class="file-upload">
          <span id="file-upload-label">Choose image</span>
          {{ form.cover_image }}
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-full">Create</button>
    </form>
  </div>
</div>
{% endblock %}
