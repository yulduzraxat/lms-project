{% extends 'base.html' %}
{% block title %}Sign In — EDULIX{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card glass">
    <h1 class="section-title">Sign In</h1>
    <p class="text-muted mb-6">Welcome back</p>

    <form method="post" class="auth-form">
      {% csrf_token %}

      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="input-field" placeholder="username" required>
      </div>

      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="input-field" placeholder="••••••••" required>
      </div>

      {% if form.errors %}
        <p class="form-error">Incorrect username or password.</p>
      {% endif %}

      <button type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>

    <p class="form-hint mt-4">
      Don't have an account? <a href="{% url 'register' %}" class="link">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
