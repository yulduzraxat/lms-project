{% extends 'base.html' %}
{% block title %}New Lesson — EDULIX{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card glass">
    <h1 class="section-title">Add a lesson to "{{ course.title }}"</h1>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label>Lesson title</label>
        {{ form.title }}
      </div>
      <div class="form-group">
        <label>Lesson content</label>
        {{ form.content }}
      </div>
      <div class="form-group">
        <label>Video file (optional)</label>
        <label class="file-upload">
          <span id="file-upload-label">Choose video</span>
          {{ form.video_file }}
        </label>
      </div>
      <button type="submit" class="btn btn-primary w-full">Add lesson</button>
    </form>
  </div>
</div>
{% endblock %}
